<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishor People CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F0F2F8;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --border:#E2E6F0;
  --border2:#C8D0E0;
  --text:#1A1D2E;
  --muted:#6B7280;
  --dim:#D0D5E8;
  --blue:#3B6EE8;
  --blue-dim:#EBF0FF;
  --purple:#7C4EE8;
  --purple-dim:#F0EBFF;
  --green:#0D9E6E;
  --green-dim:#E6F7F2;
  --yellow:#D97706;
  --yellow-dim:#FEF3E2;
  --red:#DC2626;
  --red-dim:#FEE8E8;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
a{text-decoration:none}

/* HEADER */
.hdr{background:#FFFFFF;border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px #0000000A}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.hdr-title{font-size:14px;font-weight:600;color:#1A1D2E}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px}
.stats{display:flex;gap:6px}
.stat{background:#F5F7FF;border:1px solid var(--border);border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.stat b{font-weight:600}
.stat.blue b{color:var(--blue)}
.stat.purple b{color:var(--purple)}
.stat.green b{color:var(--green)}
.stat.white b{color:#fff}

/* TOOLBAR */
.toolbar{padding:14px 28px;display:flex;align-items:center;gap:8px;background:#F8F9FD;border-bottom:1px solid var(--border)}
.search{flex:1;position:relative}
.search input{width:100%;background:#FFFFFF;border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border .15s}
.search input:focus{border-color:var(--blue)}
.search input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.filters{display:flex;gap:4px}
.filter{background:#FFFFFF;border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter:hover{border-color:var(--border2);color:var(--text)}
.filter.active{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.actions{display:flex;gap:6px}
.btn{border:none;border-radius:7px;padding:7px 14px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-guess{background:linear-gradient(135deg,#059669,#047857);color:#fff}
.btn-verify{background:linear-gradient(135deg,var(--yellow),#D97706);color:#fff}
.btn-export{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}

/* BANNER */
.banner{margin:12px 28px;background:#E6F7F2;border:1px solid #0D9E6E40;border-radius:10px;padding:12px 16px;display:none;align-items:flex-start;gap:12px;font-size:12px}
.banner.show{display:flex}
.spinner{width:14px;height:14px;border:2px solid #34D39930;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.banner-status{color:var(--green);font-weight:600}
.banner-stats{display:flex;gap:16px;margin-left:auto}
.banner-stats span{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.banner-stats b{font-weight:600}
.banner-stats .bv b{color:var(--green)}
.banner-stats .bf b{color:var(--red)}
.banner-stats .br b{color:var(--yellow)}

/* SECTION HDR */
.section-hdr{padding:10px 28px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.section-count{font-size:11px;color:var(--muted)}
.section-count b{color:var(--blue);font-weight:600}

/* CONTENT */
.content{padding:0 28px 40px}

/* COMPANY GROUP */
.co-group{background:#FFFFFF;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:all .2s;box-shadow:0 1px 3px #0000000A}
.co-group:hover{border-color:#A0AACC;box-shadow:0 2px 8px #0000001A}

.co-hdr{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.co-hdr:hover{background:#F5F7FF}

.co-av{width:36px;height:36px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.co-av-0{background:linear-gradient(135deg,#3B6EE8,#7C4EE8)}
.co-av-1{background:linear-gradient(135deg,#0D9E6E,#0D7A55)}
.co-av-2{background:linear-gradient(135deg,#E85555,#E8A020)}
.co-av-3{background:linear-gradient(135deg,#7C4EE8,#C040A0)}
.co-av-4{background:linear-gradient(135deg,#E8A020,#E85555)}

.co-info{flex:1;min-width:0}
.co-name{font-size:13px;font-weight:600;color:#1A1D2E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.co-tag{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.co-link{font-size:10px;color:var(--blue);opacity:.7;transition:opacity .15s}
.co-link:hover{opacity:1}
.co-link-g{color:var(--green)}

.co-right{display:flex;align-items:center;gap:8px}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600}
.badge-p{background:var(--blue-dim);color:var(--blue);border:1px solid #4F8EF730}
.badge-e{background:var(--green-dim);color:var(--green);border:1px solid #34D39930}
.badge-ne{background:var(--dim);color:var(--muted);border:1px solid var(--border)}
.co-toggle{color:var(--muted);font-size:11px;transition:transform .2s;margin-left:4px}
.co-toggle.open{transform:rotate(180deg)}

/* PEOPLE TABLE */
.p-table{display:none}
.p-table.open{display:block}
.p-table table{width:100%;border-collapse:collapse}
.p-table th{padding:8px 18px;text-align:left;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);border-top:1px solid var(--border);background:#F8F9FD}
.p-table td{padding:10px 18px;font-size:11px;border-bottom:1px solid var(--border);vertical-align:middle}
.p-table tr:last-child td{border-bottom:none}
.p-table tr:hover td{background:#F5F7FF}

.p-av{width:24px;height:24px;border-radius:50%;background:#E8EBFF;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--blue);flex-shrink:0}
.p-name{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500}
.p-title{color:var(--muted);font-size:10px}
.p-loc{color:var(--muted);font-size:10px}
.li-btn{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font-size:10px;opacity:.6;transition:opacity .15s}
.li-btn:hover{opacity:1}

/* EMAIL TAGS */
.etag{font-family:monospace;font-size:10px;padding:2px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.etag-v{background:var(--green-dim);color:var(--green);border:1px solid #34D39940}
.etag-g{background:var(--yellow-dim);color:var(--yellow);border:1px solid #FBBF2440}
.etag-f{background:var(--red-dim);color:var(--red);border:1px solid #F8717140}

/* SOURCE */
.src{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}
.src-a{background:var(--blue-dim);color:var(--blue);border:1px solid #4F8EF730}
.src-l{background:var(--purple-dim);color:var(--purple);border:1px solid #9B6EF730}

.both-badge{background:var(--yellow-dim);color:var(--yellow);border:1px solid #FBBF2430;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:4px}

.guess-btn{background:none;border:1px solid var(--border2);border-radius:4px;padding:2px 8px;color:var(--muted);font-size:10px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.guess-btn:hover{border-color:var(--blue);color:var(--blue)}
.guess-btn:disabled{opacity:.4;cursor:not-allowed}

/* LOADING/EMPTY */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:14px}
.loading .spinner{width:32px;height:32px;border-width:2px;border-color:var(--border);border-top-color:var(--blue)}
.loading-text{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:80px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">K</div>
    <div>
      <div class="hdr-title">Kishor People CRM</div>
      <div class="hdr-sub">Apollo + LinkedIn Contacts</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat white"><b id="dbTotal">0</b> total companies</div>
    <div class="stat blue"><b id="statApollo">0</b> apollo</div>
    <div class="stat purple"><b id="statLinkedin">0</b> linkedin</div>
    <div class="stat green"><b id="statEmail">0</b> with email</div>
  </div>
</div>

<div class="toolbar">
  <div class="search">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search name, company, title, location...">
  </div>
  <div class="filters">
    <button class="filter active" onclick="setFilter('all',this)">All</button>
    <button class="filter" onclick="setFilter('apollo',this)">🔵 Apollo</button>
    <button class="filter" onclick="setFilter('linkedin',this)">🔗 LinkedIn</button>
    <button class="filter" onclick="setFilter('verified',this)">✅ Verified</button>
    <button class="filter" onclick="setFilter('unverified',this)">💡 Unverified</button>
    <button class="filter" onclick="setFilter('noemail',this)">No Email</button>
  </div>
  <div class="actions">
    <button class="btn btn-verify" onclick="findAndVerifyAll()" id="mainVerifyBtn">⚡ Find & Verify All Emails</button>
    <button class="btn btn-export" onclick="exportCSV()">⬇ Export</button>
  </div>
</div>

<div class="banner" id="banner">
  <div style="width:100%">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div class="spinner"></div>
      <span class="banner-status" id="bannerStatus">Verifying...</span>
      <div class="banner-stats" style="margin-left:auto;">
        <span class="bv">✅ Verified: <b id="bv">0</b></span>
        <span class="bf">❌ Failed: <b id="bf">0</b></span>
        <span class="br">⏳ Remaining: <b id="br">0</b></span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      <span style="font-size:11px;color:#0D9E6E;font-weight:600;" id="bannerPerson"></span>
      <span style="font-size:11px;color:#6B7280;" id="bannerFormat"></span>
    </div>
    <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;" id="formatDots"></div>
    <div style="height:3px;background:#E2E6F0;border-radius:2px;">
      <div id="bannerBar" style="height:3px;background:#0D9E6E;border-radius:2px;width:0%;transition:width 0.3s;"></div>
    </div>
  </div>
</div>

<div class="section-hdr">
  <div class="section-title">Companies & People</div>
  <div class="section-count">Showing <b id="showCo">0</b> companies · <b id="showPpl">0</b> people</div>
</div>

<div class="content" id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading from Supabase...</div>
  </div>
</div>

<script>
const SB = 'https://upbnlzvxpfsyzwsgajzo.supabase.co';
const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwYm5senZ4cGZzeXp3c2dhanpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODA3MjYsImV4cCI6MjA5NDY1NjcyNn0.RAbkIQZnDSQJbhV4wv_uPw_PugY915EQA0BmVKF7gyc';
const RENDER = 'https://kishor-lead-engine.onrender.com';

let allPeople = [], coMap = {}, curFilter = 'all', searchQ = '';

const h = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
}

function avatarClass(name) {
  const n = (name || '').charCodeAt(0) % 5;
  return `co-av-${n}`;
}

async function api(path, opts={}) {
  const r = await fetch(`${SB}/rest/v1/${path}`, {
    headers: { 'apikey': SK, 'Authorization': `Bearer ${SK}`, ...opts.headers },
    ...opts
  });
  return r;
}

async function load() {
  const [pRes, cRes, cCount] = await Promise.all([
    api('people?select=*&order=created_at.desc&limit=5000'),
    api('companies?select=id,company_name,linkedin_url,city,country,website,full_url&limit=2000'),
    api('companies?select=id', { headers: { 'Prefer': 'count=exact', 'Range': '0-0' } })
  ]);

  allPeople = await pRes.json();
  const cos = await cRes.json();
  cos.forEach(c => coMap[c.company_name] = c);

  const totalCo = (cCount.headers.get('content-range') || '').split('/')[1] || cos.length;
  h('dbTotal').textContent = Number(totalCo).toLocaleString();

  render();
}

function filtered() {
  let p = [...allPeople];
  if (curFilter === 'apollo') p = p.filter(x => x.source === 'apollo');
  if (curFilter === 'linkedin') p = p.filter(x => x.source === 'linkedin_extension');
  if (curFilter === 'email') p = p.filter(x => x.email);
  if (curFilter === 'noemail') p = p.filter(x => !x.email);
  if (curFilter === 'verified') p = p.filter(x => x.email && x.email_status === 'verified');
  if (curFilter === 'unverified') p = p.filter(x => x.email && x.email_status !== 'verified');
  if (searchQ) {
    const q = searchQ.toLowerCase();
    p = p.filter(x =>
      (x.full_name||'').toLowerCase().includes(q) ||
      (x.company_name||'').toLowerCase().includes(q) ||
      (x.title||'').toLowerCase().includes(q) ||
      (x.location||'').toLowerCase().includes(q) ||
      (x.email||'').toLowerCase().includes(q)
    );
  }
  return p;
}

function groupBy(people) {
  const g = {};
  people.forEach(p => {
    const k = p.company_name || 'Unknown';
    if (!g[k]) g[k] = [];
    g[k].push(p);
  });
  return g;
}

function urlCount(people) {
  const uc = {}, nc = {};
  people.forEach(p => {
    if (p.linkedin_url) uc[p.linkedin_url] = (uc[p.linkedin_url]||0)+1;
    const k = ((p.full_name||'')+'|'+(p.company_name||'')).toLowerCase();
    nc[k] = (nc[k]||0)+1;
  });
  return { uc, nc };
}

function renderUnverifiedSection(people, uc, nc, total) {
  const byCompany = groupBy(people);
  const sorted = Object.entries(byCompany).sort((a,b) => b[1].length - a[1].length);

  let html = `
    <div style="background:#FEF3E2;border:1px solid #FBBF2460;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>
        <div style="font-size:13px;font-weight:600;color:#D97706;">💡 ${total} Unverified Emails</div>
        <div style="font-size:11px;color:#92400E;margin-top:2px;">These emails were guessed but not SMTP verified. Re-verify to confirm or discard.</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="background:linear-gradient(135deg,#D97706,#B45309);color:#fff;font-size:11px;" onclick="reVerifyUnverified()">⚡ Re-Verify All Unverified</button>
        <button class="btn" style="background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-size:11px;" onclick="clearUnverified()">🗑 Clear All Unverified</button>
        <button class="btn btn-export" onclick="exportUnverified()">⬇ Export Unverified</button>
      </div>
    </div>`;

  let idx = 0;
  sorted.forEach(([coName, people]) => {
    const co = coMap[coName] || {};
    const website = (co.website || co.full_url || '').replace(/https?:\/\//,'').replace(/www\./,'').split('/')[0];
    const av = avatarClass(coName);
    const gid = 'uv'+idx; idx++;

    html += `<div class="co-group" id="${gid}" style="border-left:3px solid #D97706;">
      <div class="co-hdr" onclick="toggle('${gid}')">
        <div class="co-av ${av}">${initials(coName)}</div>
        <div class="co-info">
          <div class="co-name">${coName}</div>
          <div class="co-meta">
            ${website ? `<a class="co-link co-link-g" href="https://${website}" target="_blank" onclick="event.stopPropagation()">🌐 ${website}</a>` : ''}
          </div>
        </div>
        <div class="co-right">
          <span class="badge" style="background:#FEF3E2;color:#D97706;border:1px solid #FBBF2440;">${people.length} unverified</span>
          <span class="co-toggle" id="tog-${gid}">▼</span>
        </div>
      </div>
      <div class="p-table" id="tbl-${gid}">
        <table>
          <thead><tr>
            <th>Name</th><th>Title</th><th>Email (Unverified)</th><th>Action</th>
          </tr></thead>
          <tbody>
            ${people.map(p => `<tr>
              <td><div class="p-name">
                <div class="p-av">${initials(p.full_name)}</div>
                ${cleanName(p.full_name) || '—'}
              </div></td>
              <td><div class="p-title">${p.title || '—'}</div></td>
              <td>
                <div style="display:flex;flex-direction:column;gap:2px;">
                  <span class="etag etag-g" id="et-${p.id}">${p.email}</span>
                  <span style="font-size:9px;color:var(--yellow)">💡 Guessed — not verified</span>
                </div>
              </td>
              <td style="display:flex;gap:4px;">
                <button class="guess-btn" style="border-color:#D97706;color:#D97706;" onclick="reVerifyOne('${p.id}','${(p.full_name||'').replace(/'/g,"\'")}','${coName.replace(/'/g,"\'")}',this)">↺ Re-verify</button>
                <button class="guess-btn" style="border-color:#DC2626;color:#DC2626;" onclick="clearOne('${p.id}',this)">✕ Clear</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });

  h('content').innerHTML = html;
  if (idx > 0) toggle('uv0');
}

async function reVerifyOne(id, name, coName, btn) {
  btn.textContent = '⏳';
  btn.disabled = true;
  const domain = await getDomain(coName);
  if (!domain) { btn.textContent = 'No domain'; btn.disabled = false; return; }
  const data = await smtpVerify(name, domain);
  const p = allPeople.find(x => x.id === id);
  if (data.success && data.method === 'smtp_verified') {
    if (p) { p.email = data.email; p.email_status = 'verified'; }
    await saveMail(id, data.email);
    const tag = h('et-'+id);
    if (tag) {
      tag.className = 'etag etag-v';
      tag.textContent = data.email;
      tag.nextElementSibling.textContent = '✅ Verified!';
      tag.nextElementSibling.style.color = 'var(--green)';
    }
    btn.textContent = '✅';
  } else {
    btn.textContent = '❌ Failed';
    btn.disabled = false;
  }
}

async function clearOne(id, btn) {
  if (!confirm('Clear this email?')) return;
  btn.disabled = true;
  await fetch(`${SB}/rest/v1/people?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': `Bearer ${SK}` },
    body: JSON.stringify({ email: null })
  });
  const p = allPeople.find(x => x.id === id);
  if (p) { p.email = null; p.email_status = null; }
  btn.closest('tr').style.opacity = '0.3';
  h('statEmail').textContent = allPeople.filter(p=>p.email).length;
}

async function reVerifyUnverified() {
  const unverified = allPeople.filter(p => p.email && p.email_status !== 'verified');
  if (!unverified.length) { alert('No unverified emails!'); return; }
  if (!confirm(`Re-verify ${unverified.length} unverified emails via SMTP?`)) return;
  setFilter('unverified', document.querySelector('.filter.active'));
  findAndVerifyAll();
}

async function clearUnverified() {
  const unverified = allPeople.filter(p => p.email && p.email_status !== 'verified');
  if (!unverified.length) { alert('No unverified emails to clear!'); return; }
  if (!confirm(`Clear ALL ${unverified.length} unverified emails from database? This cannot be undone.`)) return;
  for (const p of unverified) {
    await fetch(`${SB}/rest/v1/people?id=eq.${p.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': `Bearer ${SK}` },
      body: JSON.stringify({ email: null })
    });
    p.email = null; p.email_status = null;
  }

}

}

async function getDomain(coName) {
  const co = coMap[coName] || {};
  const raw = co.website || co.full_url || '';
  return raw.replace(/https?:\/\//, '').replace(/www\./,'').split('/')[0];
}

function cleanName(raw) {
  return (raw || '').replace(/^View\s+/i, '').replace(/'s\s+profile$/i, '').trim();
}

function generateCandidates(fullName, domain) {
  const name = cleanName(fullName);
  const parts = name.toLowerCase().replace(/[^a-z\s]/g, '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return [];
  const first = parts[0], last = parts[parts.length - 1];
  const f = first[0], l = last[0];
  const allInitials = parts.map(p => p[0]).join('');
  const raw = [
    `${first}.${last}`,      // 1. firstname.lastname  (548 in DK list)
    `${first}`,              // 2. firstname            (1116)
    `${f}${l}`,              // 3. fl initials          (647)
    allInitials,             // 4. all initials         (284)
    `${first}${l}`,          // 5. firstnamel           (30)
    `${first}.${l}`,         // 6. firstname.l          (24)
    `${last}`,               // 7. lastname             (14)
    `${f}.${last}`,          // 8. f.lastname           (12)
    `${first}${last}`,       // 9. firstnamelastname    (12)
  ];
  const seen = new Set();
  return raw
    .filter(c => c && c.length > 0)
    .map(c => `${c}@${domain}`)
    .filter(email => { if (seen.has(email)) return false; seen.add(email); return true; });
}

const FORMAT_LABELS = [
  'firstname.lastname','firstname','fl','all_initials',
  'firstnamel','firstname.l','lastname','f.lastname','firstnamelastname'
];

function renderFormatDots(candidates, currentIdx, result) {
  const dots = h('formatDots');
  if (!dots) return;
  dots.innerHTML = candidates.map((email, i) => {
    const label = FORMAT_LABELS[i] || `f${i+1}`;
    const local = email.split('@')[0];
    let bg, title;
    if (i < currentIdx) { bg = result && i === result ? '#0D9E6E' : '#DC2626'; title = '✗'; }
    else if (i === currentIdx) { bg = '#D97706'; title = '⏳'; }
    else { bg = '#E2E6F0'; title = ''; }
    return `<span title="${label}: ${email}" style="background:${bg};color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;font-family:monospace;cursor:default;">${local}</span>`;
  }).join('');
}

async function smtpVerify(full_name, domain, onProgress) {
  const candidates = generateCandidates(full_name, domain);
  if (!candidates.length) return { success: false, email: null };
  let verifiedIdx = null;
  for (let i = 0; i < candidates.length; i++) {
    const email = candidates[i];
    if (onProgress) onProgress(candidates, i, null);
    try {
      const r = await fetch(`${RENDER}/verify-email?email=${encodeURIComponent(email)}`);
      const data = await r.json();
      if (data.valid === true) {
        if (onProgress) onProgress(candidates, i, i);
        return { success: true, email, method: 'smtp_verified' };
      }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 300));
  }
  if (onProgress) onProgress(candidates, candidates.length, null);
  return { success: false, email: candidates[0], method: 'guess' };
}

async function saveMail(id, email) {
  await fetch(`${SB}/rest/v1/people?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': `Bearer ${SK}` },
    body: JSON.stringify({ email })
  });
  const p = allPeople.find(x => x.id === id);
  if (p) p.email = email;
  h('statEmail').textContent = allPeople.filter(p=>p.email).length;
}

async function guessOne(id, name, coName, btn) {
  btn.textContent = '⏳';
  btn.disabled = true;
  const domain = await getDomain(coName);
  if (!domain) { btn.textContent = 'No domain'; return; }
  const data = await smtpVerify(name, domain);
  if (data.email) {
    await saveMail(id, data.email);
    const cell = btn.parentElement;
    const cls = data.method === 'smtp_verified' ? 'etag-v' : 'etag-g';
    cell.innerHTML = `<span class="etag ${cls}" id="et-${id}">${data.email}</span>`;
    const p = allPeople.find(x=>x.id===id);
    if (p) p.email_status = data.method === 'smtp_verified' ? 'verified' : 'guess';
  } else {
    btn.textContent = 'No email found';
    btn.disabled = false;
  }
}

async function findAndVerifyAll() {
  // Targets: people with no email OR unverified email
  const noEmail = allPeople.filter(p => !p.email);
  const unverified = allPeople.filter(p => p.email && p.email_status !== 'verified');
  const alreadyVerified = allPeople.filter(p => p.email_status === 'verified').length;
  const total = noEmail.length + unverified.length;

  if (!total) { alert(`All ${alreadyVerified} emails already verified!`); return; }
  if (!confirm(`Find & verify emails for:\n• ${noEmail.length} people with no email\n• ${unverified.length} people with unverified email\n\n(${alreadyVerified} already verified — skipping)\n\nThis tries 9 email formats per person via SMTP (firstname.lastname, firstname, fl, all_initials, firstnamel, firstname.l, lastname, f.lastname, firstnamelastname).`)) return;

  const banner = h('banner');
  banner.classList.add('show');
  banner.querySelector('.spinner').style.display = '';
  h('bv').textContent = alreadyVerified;
  h('bf').textContent = 0;
  h('br').textContent = total;
  h('bannerStatus').textContent = 'Starting...';

  let v = alreadyVerified, f = 0, processed = 0;

  // Process all people — patterns now handled by global generateCandidates()
  function getPatterns(fullName, domain) {
    const parts = (fullName||'').toLowerCase().replace(/[^a-z\s]/g,'').trim().split(/\s+/);
    const first = parts[0]||'', last = parts[parts.length-1]||'';
    if (!first || !last || first === last) return [`${first}@${domain}`];
    return [
      `${first}.${last}@${domain}`,
      `${first}@${domain}`,
      `${first[0]}${last}@${domain}`,
      `${first[0]}.${last}@${domain}`,
      `${last}.${first}@${domain}`,
      `${first}${last[0]}@${domain}`,
      `${last}@${domain}`,
      `${first}${last}@${domain}`,
    ];
  }

  async function processOne(p) {
    const domain = await getDomain(p.company_name);
    if (!domain) return null;

    // Call backend which tries all patterns via SMTP
    const data = await smtpVerify(p.full_name, domain);
    return data;
  }

  // Process all people
  const allToProcess = [...noEmail, ...unverified];

  for (let i = 0; i < allToProcess.length; i++) {
    const p = allToProcess[i];
    processed++;
    h('br').textContent = total - processed;
    h('bannerStatus').textContent = `[${processed}/${total}] ${cleanName(p.full_name || 'Unknown')}`;
    const pct = Math.round((processed / total) * 100);
    h('bannerBar').style.width = pct + '%';

    const domain = await getDomain(p.company_name);
    if (!domain) { f++; h('bf').textContent = f; continue; }

    // Update person name in monitor
    h('bannerPerson').textContent = cleanName(p.full_name || 'Unknown');
    h('formatDots').innerHTML = '';
    h('bannerFormat').textContent = 'trying formats...';

    const data = await smtpVerify(p.full_name, domain, (candidates, idx, verifiedIdx) => {
      renderFormatDots(candidates, idx, verifiedIdx);
      const label = FORMAT_LABELS[idx] || '';
      const email = candidates[idx] || '';
      h('bannerFormat').textContent = idx < candidates.length
        ? `[${idx+1}/9] trying: ${email.split('@')[0]}`
        : verifiedIdx !== null ? `✅ found: ${candidates[verifiedIdx]}` : '❌ none verified';
    });
    const tag = h('et-'+p.id);

    if (data.success && data.method === 'smtp_verified') {
      // SMTP verified!
      v++; p.email_status = 'verified'; p.email = data.email;
      h('bv').textContent = v;
      await saveMail(p.id, data.email);
      
      // Update DOM
      const cell = tag ? tag.parentElement : document.querySelector(`button[data-id="${p.id}"]`)?.parentElement;
      if (cell) {
        cell.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px;">
          <span class="etag etag-v" id="et-${p.id}">${data.email}</span>
          <span style="font-size:9px;color:var(--green)">✅ Verified</span>
        </div>`;
      }
    } else {
      // SMTP failed — save best guess if no email yet
      f++;
      if (!p.email && data.email) {
        p.email = data.email; p.email_status = 'failed';
        await saveMail(p.id, data.email);
        const cell = document.querySelector(`button[data-id="${p.id}"]`)?.parentElement;
        if (cell) {
          cell.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px;">
            <span class="etag etag-f" id="et-${p.id}">${data.email}</span>
            <span style="font-size:9px;color:var(--yellow)">💡 Best guess</span>
          </div>`;
        }
      } else if (tag) {
        p.email_status = 'failed';
        tag.className = 'etag etag-f';
        const lbl = tag.nextElementSibling;
        if (lbl) { lbl.style.color = 'var(--red)'; lbl.textContent = '❌ Not verified'; }
      }
      h('bf').textContent = f;
    }

    await sleep(200);
  }

  const pct = Math.round((v / (v + f)) * 100) || 0;
  h('bannerStatus').textContent = `Done! ✅ ${v} verified · 💡 ${f} best guess · ${pct}% accuracy`;
  h('br').textContent = 0;
  h('banner').querySelector('.spinner').style.display = 'none';
  h('statEmail').textContent = allPeople.filter(p=>p.email).length;
}
